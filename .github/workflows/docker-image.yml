name: Docker Image CI

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'feature/docker-containerization'
      - 'feature/sn-auth-package-extraimprovements'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'develop'
      - 'main'
      - 'feature/sn-auth-package-extraimprovements'

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip draft PRs
    if: github.event.pull_request.draft == false || github.event_name == 'push'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "Dockerfile" ]; then
            echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Dockerfile found, skipping Docker build"
          fi

      - name: Set up Docker metadata
        if: steps.check_dockerfile.outputs.dockerfile_exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sensenetcsp/sn-client
          tags: |
            # Clean branch name (e.g., feature-docker-containerization)
            type=ref,event=branch
            # Branch name with SHA (e.g., feature-docker-containerization-abc1234)
            type=ref,event=branch,suffix=-{{sha}}
            # Latest tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # PR number for pull requests
            type=ref,event=pr

      - name: Login to DockerHub
        if: steps.check_dockerfile.outputs.dockerfile_exists == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_dockerfile.outputs.dockerfile_exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
